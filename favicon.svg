<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景グラデーション：冠着山の深い森の緑 -->
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2b1e"/>
      <stop offset="50%" stop-color="#16432e"/>
      <stop offset="100%" stop-color="#1f5a3b"/>
    </linearGradient>
    
    <!-- 枠線ゴールドグラデーション -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="30%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#8E6A10"/>
    </linearGradient>

    <!-- 文字用ゴールドグラデーション（月光・金箔の輝き） -->
    <linearGradient id="goldKanji" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFF2B8"/>
      <stop offset="60%" stop-color="#E8BE50"/>
      <stop offset="100%" stop-color="#B8852F"/>
    </linearGradient>

    <!-- ドロップシャドウ -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="kanjiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#05140d" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- 外枠角丸背景 -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="url(#forestGrad)" stroke="url(#goldBorder)" stroke-width="16" filter="url(#subtleShadow)"/>
  
  <!-- 内側の繊細な飾り枠 -->
  <rect x="42" y="42" width="428" height="428" rx="88" ry="88" fill="none" stroke="url(#goldBorder)" stroke-width="3" stroke-opacity="0.5"/>

  <!-- 「冠」文字 -->
  <text x="256" y="278" 
        font-family="'Noto Serif JP', 'Source Han Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', 'MS PMincho', serif" 
        font-size="340" 
        font-weight="900" 
        text-anchor="middle" 
        dominant-baseline="central" 
        fill="url(#goldKanji)" 
        filter="url(#kanjiShadow)">冠</text>
</svg>
